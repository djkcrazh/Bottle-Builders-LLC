# Supabase project config for the Bottle Builders site.
# Run `supabase start` for a local stack, `supabase db push` to apply migrations.

project_id = "bottle-builders"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# The public site writes enquiries anonymously. No sign-in surface here.
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["https://bottlebuilders.com"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
